# 关掉空白 Issue：反馈必须走模板，保证版本号 / 系统 / 复现步骤这三样不缺。
blank_issues_enabled: false
contact_links:
  - name: 💬 Ask a question / 使用问题
    url: https://github.com/Tessoa/feedback/discussions/new?category=q-a
    about: Where a feature lives, what a setting does, anything the docs left unclear.
