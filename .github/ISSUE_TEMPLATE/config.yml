    url: https://github.com/Tessoa/feedback/discussions/new?category=ideas
    about: Not sure it should be built yet? Talk it over here first.
  - name: 📖 Read this first / 提交前先看
    url: https://github.com/Tessoa/feedback/blob/main/README.md
    about: Search the existing issues, and have your version number and steps to reproduce ready.
